name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Install hmmlearn for the cross-check test
        # No hmmlearn wheel exists for every Python version; the test skips without it.
        continue-on-error: true
        run: pip install hmmlearn
      - name: Demo on simulated data
        run: python demo.py --no-plot
      - name: Research tests
        working-directory: research
        run: python -m pytest -q
      - name: Trading tests
        working-directory: trading
        run: python -m pytest -q
